name: Temporary npm lockfile generation

on:
  push:
    branches:
      - security/nextjs-patch-update
    paths:
      - .github/workflows/tmp-npm-lockfile-generation.yml

permissions:
  contents: write

concurrency:
  group: bizaz-temp-lockfile-generation
  cancel-in-progress: false

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@v4
        with:
          ref: security/nextjs-patch-update
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Update only vulnerable transitive dependency chain
        working-directory: frontend
        run: |
          npm update @typescript-eslint/eslint-plugin @typescript-eslint/parser @typescript-eslint/type-utils @typescript-eslint/typescript-estree @typescript-eslint/utils --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-online

      - name: Verify package manifest unchanged
        run: git diff --exit-code -- frontend/package.json

      - name: Install from updated lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Print full dependency audit findings
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_exit=$?
          set -e
          node - "$RUNNER_TEMP/npm-audit.json" "$audit_exit" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('NPM_AUDIT_SUMMARY ' + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('NPM_AUDIT_FINDING ' + JSON.stringify({
              name, severity: item.severity, isDirect: item.isDirect,
              range: item.range, fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map(v => typeof v === 'string' ? {name:v} : {name:v.name,title:v.title,url:v.url,range:v.range,severity:v.severity}),
              nodes: item.nodes
            }));
          }
          console.log('NPM_AUDIT_EXIT ' + process.argv[3]);
          NODE

      - name: Verify production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=low

      - name: Verify frontend production build
        working-directory: frontend
        run: npm run build

      - name: Commit only package-lock.json
        shell: bash
        run: |
          git add -- frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current; no commit required."
          else
            git diff --cached --stat
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(frontend): update vulnerable transitive dependencies"
            git push origin HEAD:security/nextjs-patch-update
          fi
