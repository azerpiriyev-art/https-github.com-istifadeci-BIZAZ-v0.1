name: Temporary PR10 ARM64 runtime verification

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Must be the authorized PR #10 HEAD SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bizaz-pr10-arm64-runtime
  cancel-in-progress: false

jobs:
  arm64-runtime:
    name: Alpine ARM64 container startup and HTTP health
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Validate authorized target
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          expected="47806439762cff4d3954e64a26b58861bfe6222c"
          if [[ "$TARGET_SHA" != "$expected" ]]; then
            echo "Refusing unauthorized target SHA."
            exit 1
          fi
          echo "AUTHORIZED_TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Checkout exact PR #10 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$AUTHORIZED_TARGET_SHA"
          echo "CHECKED_OUT_SHA=$actual"

      - name: Build ARM64 Alpine frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 \
            --tag bizaz-pr10-arm64-runtime:${GITHUB_RUN_ID} \
            --file frontend/Dockerfile frontend

      - name: Start container and verify HTTP health
        shell: bash
        run: |
          set -euo pipefail
          name="bizaz-pr10-arm64-runtime-${GITHUB_RUN_ID}"
          docker run --detach --name "$name" \
            --platform linux/arm64 \
            --publish 3000:3000 \
            bizaz-pr10-arm64-runtime:${GITHUB_RUN_ID}

          cleanup() {
            docker logs "$name" || true
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker image rm bizaz-pr10-arm64-runtime:${GITHUB_RUN_ID} >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          success=0
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /tmp/bizaz-login-response \
              --write-out '%{http_code}' http://127.0.0.1:3000/login || true)"
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "HTTP_LOGIN_STATUS=$status"
              success=1
              break
            fi
            sleep 2
          done

          if [[ "$success" -ne 1 ]]; then
            echo "HTTP_LOGIN_CHECK=FAIL"
            docker inspect "$name" --format '{{json .State.Health}}' || true
            exit 1
          fi

          for attempt in $(seq 1 15); do
            health="$(docker inspect "$name" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}')"
            if [[ "$health" == "healthy" ]]; then
              echo "CONTAINER_HEALTH=healthy"
              exit 0
            fi
            sleep 2
          done

          echo "CONTAINER_HEALTH=$health"
          exit 1

      - name: Cleanup container and image
        if: always()
        shell: bash
        run: |
          docker rm --force "bizaz-pr10-arm64-runtime-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          docker image rm "bizaz-pr10-arm64-runtime:${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
