name: BIZAZ CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bizaz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend syntax and full regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Start isolated PostgreSQL
        run: |
          docker run --detach             --name bizaz-ci-postgres             --publish 5432:5432             -e POSTGRES_DB=bizaz_procurement_test             -e POSTGRES_USER=bizaz_ci             -e POSTGRES_PASSWORD=bizaz_ci_password             postgres:16-alpine

          for attempt in {1..30}; do
            if docker exec bizaz-ci-postgres pg_isready -U bizaz_ci -d bizaz_procurement_test; then
              exit 0
            fi
            sleep 2
          done

          docker logs bizaz-ci-postgres
          exit 1

      - name: Apply all database migrations
        shell: bash
        run: |
          for migration in db/migrations/*.sql; do
            echo "=== APPLY $migration ==="
            docker exec -i               -e PGPASSWORD=bizaz_ci_password               bizaz-ci-postgres               psql -U bizaz_ci -d bizaz_procurement_test               -v ON_ERROR_STOP=1 -f - < "$migration"
          done

      - name: Create restricted test-runner role
        id: test-db-role
        run: |
          test_password="$(openssl rand -hex 32)"
          echo "::add-mask::$test_password"
          echo "password=$test_password" >> "$GITHUB_OUTPUT"
          app_password="$(openssl rand -hex 32)"
          echo "::add-mask::$app_password"
          echo "app_password=$app_password" >> "$GITHUB_OUTPUT"
          docker exec -i -e PGPASSWORD=bizaz_ci_password bizaz-ci-postgres psql \
            -U bizaz_ci -d bizaz_procurement_test \
            -v ON_ERROR_STOP=1 \
            -v test_password="$test_password" \
            -v app_password="$app_password" <<'SQL'
          CREATE ROLE bizaz_test_runner LOGIN PASSWORD :'test_password';
          GRANT CONNECT ON DATABASE bizaz_procurement_test TO bizaz_test_runner;
          GRANT USAGE ON SCHEMA public TO bizaz_test_runner;
          GRANT CREATE ON SCHEMA public TO bizaz_test_runner;
          ALTER TABLE public.payments OWNER TO bizaz_test_runner;
          ALTER TABLE public.notifications OWNER TO bizaz_test_runner;

          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bizaz_test_runner;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bizaz_test_runner;
          CREATE ROLE bizaz_app LOGIN PASSWORD :'app_password';
          GRANT CONNECT ON DATABASE bizaz_procurement_test TO bizaz_app;
          GRANT USAGE ON SCHEMA public TO bizaz_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bizaz_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bizaz_app;
          SQL

      - name: Seed backend acceptance data
        working-directory: backend
        env:
          BIZAZ_TEST_DATABASE_URL: postgresql://bizaz_test_runner:${{ steps.test-db-role.outputs.password }}@127.0.0.1:5432/bizaz_procurement_test
          BIZAZ_CI_SEED_ALLOW: "1"
        run: python scripts/ci_seed.py

      - name: Compile backend source
        run: python -m compileall -q backend/app

      - name: Start backend API
        shell: bash
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://bizaz_app:${{ steps.test-db-role.outputs.app_password }}@127.0.0.1:5432/bizaz_procurement_test
          JWT_SECRET: ci-test-secret-not-for-production
          BIZAZ_TEST_MODE: "true"
        run: |
          nohup python -m uvicorn app.main:app             --host 127.0.0.1             --port 8001             > /tmp/bizaz-uvicorn.log 2>&1 &

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done

          cat /tmp/bizaz-uvicorn.log
          exit 1

      - name: Run dependency integrity check
        run: python -m pip check

      - name: Run full backend regression
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://bizaz_app:${{ steps.test-db-role.outputs.app_password }}@127.0.0.1:5432/bizaz_procurement_test
          BIZAZ_TEST_DATABASE_URL: postgresql://bizaz_test_runner:${{ steps.test-db-role.outputs.password }}@127.0.0.1:5432/bizaz_procurement_test
          BIZAZ_TEST_BASE_URL: http://127.0.0.1:8001
          JWT_SECRET: ci-test-secret-not-for-production
          BIZAZ_TEST_MODE: "true"
        run: python -m pytest -q tests

  migration-smoke:
    name: PostgreSQL migration smoke check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Start isolated PostgreSQL
        run: |
          docker run --detach --name bizaz-ci-postgres --publish 5432:5432 -e POSTGRES_DB=bizaz_ci -e POSTGRES_USER=bizaz_ci -e POSTGRES_PASSWORD=bizaz_ci_password postgres:16-alpine
          for attempt in {1..30}; do
            if docker exec bizaz-ci-postgres pg_isready -U bizaz_ci -d bizaz_ci; then
              exit 0
            fi
            sleep 2
          done
          docker logs bizaz-ci-postgres
          exit 1
      - name: Apply all database migrations
        shell: bash
        run: |
          for migration in db/migrations/*.sql; do
            echo "=== APPLY $migration ==="
            docker exec -i -e PGPASSWORD=bizaz_ci_password bizaz-ci-postgres psql -U bizaz_ci -d bizaz_ci -v ON_ERROR_STOP=1 -f - < "$migration"
          done
      - name: Verify required schema
        shell: bash
        run: |
          table_count=$(docker exec -e PGPASSWORD=bizaz_ci_password bizaz-ci-postgres psql -U bizaz_ci -d bizaz_ci -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users','companies','company_members','audit_log','products','product_prices','suppliers','purchase_orders','purchase_order_items','purchase_requests','purchase_request_items','supplier_offers','supplier_offer_items','offer_selections','needs','need_items','need_pr_conversions','approval_requests','approval_steps','payments','deliveries','delivery_items','reviews','notifications');")
          test "$table_count" = "24"

          constraint_count=$(docker exec -e PGPASSWORD=bizaz_ci_password bizaz-ci-postgres psql -U bizaz_ci -d bizaz_ci -Atqc "SELECT count(*) FROM pg_constraint WHERE conname IN ('uq_products_company_sku','uq_suppliers_company_tax_id','chk_product_prices_type','product_prices_amount_check','uq_supplier_offer_items_offer_request_item');")
          test "$constraint_count" = "5"
          trigger_count=$(docker exec -e PGPASSWORD=bizaz_ci_password bizaz-ci-postgres psql -U bizaz_ci -d bizaz_ci -Atqc "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal AND tgname IN ('trg_validate_payment_purchase_order','trg_validate_payment_state','trg_validate_purchase_order_state','trg_validate_delivery_state');")
          test "$trigger_count" = "4"

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Production dependency security audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=low

      # Temporary, fail-closed exception for GHSA-vfj7-8cjw-p6xm only.
      # Expires 2026-11-14; review and remove when the upstream issue is resolved.
      - name: Full dependency audit (allow only known dev-tool advisory)
        working-directory: frontend
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");

          const advisoryUrl = "https://github.com/advisories/GHSA-vfj7-8cjw-p6xm";
          const expiry = Date.parse("2026-11-14T00:00:00Z");

          const result = spawnSync("npm", ["audit", "--json"], {
            encoding: "utf8",
            maxBuffer: 20 * 1024 * 1024,
          });

          if (result.error || !result.stdout) {
            console.error("npm audit did not return valid JSON.");
            console.error(result.stderr || result.error?.message || "Unknown error");
            process.exit(1);
          }

          let report;
          try {
            report = JSON.parse(result.stdout.replace(/^\uFEFF/, ""));
          } catch (error) {
            console.error("Could not parse npm audit JSON:", error.message);
            process.exit(1);
          }

          const findings = report.vulnerabilities || {};
          const names = Object.keys(findings).sort();
          const summary = report.metadata?.vulnerabilities || {};

          if (result.status === 0 && names.length === 0 && (summary.total || 0) === 0) {
            console.log("Full dependency audit: PASS — no vulnerabilities reported.");
            process.exit(0);
          }

          const expected = {
            "@next/eslint-plugin-next": {
              path: "node_modules/@next/eslint-plugin-next",
              version: "15.5.27",
              via: "fast-glob",
            },
            "braces": {
              path: "node_modules/braces",
              version: "3.0.3",
            },
            "eslint-config-next": {
              path: "node_modules/eslint-config-next",
              version: "15.5.27",
              via: "@next/eslint-plugin-next",
            },
            "fast-glob": {
              path: "node_modules/fast-glob",
              version: "3.3.1",
              via: "micromatch",
            },
            "micromatch": {
              path: "node_modules/micromatch",
              version: "4.0.8",
              via: "braces",
            },
          };

          const expectedNames = Object.keys(expected).sort();
          const problems = [];

          if (JSON.stringify(names) !== JSON.stringify(expectedNames)) {
            problems.push("The set of vulnerable packages differs from the approved dependency chain.");
          }

          if (
            result.status !== 1 ||
            summary.total !== 5 ||
            summary.high !== 5 ||
            summary.critical !== 0 ||
            summary.moderate !== 0 ||
            summary.low !== 0 ||
            summary.info !== 0
          ) {
            problems.push("npm audit exit status or vulnerability counts differ from the approved baseline.");
          }

          if (Date.now() >= expiry) {
            problems.push("The temporary security exception has expired; a fresh review is required.");
          }

          let lock;
          try {
            lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          } catch (error) {
            problems.push("Could not read package-lock.json: " + error.message);
            lock = { packages: {} };
          }

          for (const [name, rule] of Object.entries(expected)) {
            const finding = findings[name];
            if (!finding) {
              problems.push("Expected finding missing: " + name);
              continue;
            }

            const locked = lock.packages?.[rule.path];

            if (
              !locked ||
              locked.version !== rule.version ||
              locked.dev !== true
            ) {
              problems.push("Unexpected version or non-dev dependency detected: " + name);
            }

            if (finding.severity !== "high") {
              problems.push("Unexpected severity for " + name + ": " + finding.severity);
            }

            if (finding.isDirect !== (name === "eslint-config-next")) {
              problems.push("Unexpected direct-dependency status for " + name);
            }

            const via = Array.isArray(finding.via) ? finding.via : [];

            if (name === "braces") {
              if (
                via.length !== 1 ||
                typeof via[0] === "string" ||
                via[0].url !== advisoryUrl ||
                via[0].name !== "braces" ||
                via[0].severity !== "high" ||
                via[0].range !== "<=3.0.3"
              ) {
                problems.push("braces does not match the exact approved advisory.");
              }
            } else if (
              via.length !== 1 ||
              via[0] !== rule.via
            ) {
              problems.push("Unexpected advisory chain for " + name);
            }
          }

          if (problems.length > 0) {
            console.error("FULL DEPENDENCY AUDIT: FAIL");
            for (const problem of problems) console.error("- " + problem);
            console.error(JSON.stringify(summary));
            process.exit(1);
          }

          console.warn("FULL DEPENDENCY AUDIT: approved temporary exception only.");
          console.warn("Advisory: " + advisoryUrl);
          console.warn("Scope: braces 3.0.3 through the verified dev-only dependency chain.");
          console.warn("Expiry: 2026-11-14T00:00:00Z");
          console.log("No unexpected audit findings detected.");
          NODE

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime secrets and generated backup artifacts
        shell: bash
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)(\.env|.*\.(bak|backup|log))$|(^|/)(backups|backup-logs|backup-monitoring)/' || true)
          test -z "$forbidden" || { echo "$forbidden"; exit 1; }
      - name: Reject tracked private keys
        shell: bash
        run: |
          if git grep -nE -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!*.example'; then
            exit 1
          fi
