services:
  db:
    image: postgres:16-alpine
    container_name: bizaz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bizaz}
      POSTGRES_USER: ${POSTGRES_USER:-bizaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - bizaz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizaz -d bizaz"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bizaz_pgdata:
